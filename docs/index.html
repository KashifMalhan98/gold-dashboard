<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gold Buy-Readiness</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mute:#94a3b8;--gold:#f5c542;--g:#4ade80;--a:#fbbf24;--r:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,Segoe UI,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 32px}
.wrap{max-width:760px;margin:0 auto}h1{font-size:22px;margin:4px 0 2px;color:var(--gold);letter-spacing:.5px}
.sub{color:var(--mute);font-size:12px;margin-bottom:14px}
.hero{border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
.hero.buy{background:#14532d;border-color:#166534}.hero.imp{background:#1e3a2f}.hero.reb{background:#422006}.hero.wait{background:#450a0a}
.hero .v{font-size:20px;font-weight:700}.hero .s{color:#cbd5e1;font-size:13px;margin-top:6px}.hero .n{color:var(--gold);font-size:13px;margin-top:6px}
h2{font-size:11px;letter-spacing:1.2px;color:var(--mute);margin:20px 0 8px;font-weight:600}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border-radius:12px;padding:12px}
.g .t{font-size:12px;color:var(--mute)}.g .p{font-size:22px;font-weight:700;margin:2px 0}.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.g .st{font-size:11px;font-weight:700;margin-top:6px}
.sig{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sig .nm{font-weight:600}.sig .why{grid-column:1/2;color:var(--mute);font-size:12px}.sig .val{text-align:right;font-weight:600}
.sig .chg{text-align:right;color:var(--mute);font-size:12px}
.pill{grid-row:1/3;grid-column:2;justify-self:end}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.up{background:#14532d;color:var(--g)}.mid{background:#422006;color:var(--a)}.dn{background:#450a0a;color:var(--r)}.na{background:var(--line);color:var(--mute)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
svg.sp{width:70px;height:22px}
.note{grid-column:1/3;color:#64748b;font-size:11px}
.news{font-size:12px;color:var(--mute);margin:4px 0 0;padding-left:16px}
.foot{color:#64748b;font-size:11px;margin-top:18px;line-height:1.5}
.info{margin:6px 0 0}.info summary{cursor:pointer;color:#38bdf8;font-size:12px;list-style:none}.info summary::-webkit-details-marker{display:none}
.info div{background:#0f172a;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px;line-height:1.5;color:#cbd5e1;font-weight:400}
.nowline{font-size:12.5px;color:#e2e8f0;margin-top:6px;grid-column:1/3}
</style></head><body><div class="wrap">
<h1>GOLD BUY-READINESS</h1><div class="sub" id="sub">Loading…</div>
<div id="app"></div>
<div class="foot" id="foot"></div></div>
<script>
const $=id=>document.getElementById(id);
const nf=(x,d=0)=>x==null?"n/a":Number(x).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const FM={usd:x=>"$"+nf(x,2),usd1:x=>(x>=0?"+":"-")+"$"+nf(Math.abs(x),1),pct1:x=>(x*100).toFixed(1)+"%",num4:x=>nf(x,4),num2:x=>nf(x,2),num1:x=>nf(x,1),pct2:x=>nf(x,2)+"%",int:x=>nf(x,0),text:()=>""};
const CH={pct:x=>(x>=0?"+":"")+(x*100).toFixed(1)+"%",pp:x=>(x>=0?"+":"")+x.toFixed(2)+" pp",int:x=>(x>=0?"+":"")+nf(x,0),usd:x=>(x>=0?"+":"-")+"$"+nf(Math.abs(x),1),none:()=>""};
function spark(a){a=(a||[]).filter(x=>x!=null);if(a.length<3)return"";const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1;
 const p=a.map((v,i)=>(i/(a.length-1)*70).toFixed(1)+","+(20-((v-mn)/r)*18).toFixed(1)).join(" ");
 return `<svg class="sp" viewBox="0 0 70 22"><polyline points="${p}" fill="none" stroke="#f5c542" stroke-width="1.5"/></svg>`}
const badge=s=>s==null?'<span class="badge na">NO DATA</span>':s==1?'<span class="badge up">▲ FAVOURS BUYING</span>':s==.5?'<span class="badge mid">● UNCLEAR</span>':'<span class="badge dn">▼ SAYS WAIT</span>';
const info=t=>`<details class="info"><summary>ⓘ In plain words</summary><div>${t}</div></details>`;
const IX={
 hero:"This box answers one question: has gold's fall stopped? WAIT means not yet, so do not rush to buy. WATCH means there are early signs of a bottom but they are not confirmed. BUY means most of our checks agree the fall is over, so start buying in stages. The percentage is the share of our checks pointing to the fall ending. It is a checklist, not a forecast. Nobody can predict gold reliably.",
 plan:"Instead of guessing the exact bottom, this splits your 24 grams into small purchases over the months left. The checks above only nudge the amount: buy a bit less while the fall continues and a bit more once it stabilises. Before big events, such as the US Fed rate decision, it tells you to hold off a few days. The plus or minus rupee figure is a normal one-month price swing on what you still have to buy, which shows why perfect timing is so hard.",
 context:"Where today's gold price sits compared with its own past. A price far below its 1-year high or its averages is cheaper than it has been, but cheap can get cheaper. The rupee figure is the 10-gram price before duty and GST, so it also reflects rupee moves.",
 drivers:"These are the big forces behind gold's moves right now. When the US raises interest rates, bonds pay more and gold (which pays nothing) loses appeal. Higher oil can push inflation and rate hikes up. Falling stocks and a high VIX (a fear gauge) can force investors to sell gold to raise cash. They are shown for context and are not counted in the verdict yet.",
 groups:"We group checks that measure the same idea, so one story is not counted several times. Price and positioning looks at gold itself and fund behaviour. Dollar and rates looks at the forces that usually move gold. Fund flows looks at money moving into or out of gold funds. India-specific looks at the rupee and policy. Asia looks at Asian trading hours. A group is confirmed when its average score is 60% or more, and we want at least 3 groups to agree before saying BUY.",
 signals:"Each card is one check. The tag says whether this check favours buying (green: it points to the fall ending), is unclear (amber), or says wait (red: the fall is not over). The small line shows the last 40 days. Tap the blue text on any card to read what it means.",
 backtest:"We replayed the past: whenever a check turned green, what did gold do over the next two weeks? HELPS means gold did noticeably better after green than after red. NO CLEAR EDGE means it was no better than chance. BACKWARDS means it pointed the wrong way. A check that does not help should eventually be dropped. This period was mostly one long fall, so the results are early hints, not proof.",
 base:"This looks back about 25 years at situations like today (for example, gold far below its yearly high) and shows what happened over the next months. It gives rough odds, not promises. There have been only a handful of separate episodes, so do not treat the numbers as exact.",
 lead:"This tests a common belief: that what happens in Asia in the morning tells you what Indian gold will do. Numbers near zero mean no early-warning value. A same-day link only shows the trading hours overlap.",
 news:"Weekly reports from Asian physical gold markets: how much extra buyers pay in China, Singapore and Hong Kong, and whether Indian dealers are giving discounts. Discounts in India usually mean weak demand at current prices.",
 india:"The price of one gram of 22-carat gold, the purity used for most jewellery (91.6% pure). The first number is the official benchmark from IBJA, the India Bullion and Jewellers Association, which banks and the RBI also use. It is announced twice a day on working days. The second number is our live estimate between announcements, matched to the official rate. GST and making charges are shown separately. Shop rates can differ by a percent or so, so confirm with your jeweller before paying."};
const SIG={
 gold:{t:"The price of gold in US dollars, the world benchmark. Indian prices follow it closely. Buyers usually do better waiting until a fall has stopped instead of buying while it is still sliding.",n:{1:"Gold has stopped making new lows and is holding above its recent average.",0.5:"Gold is partly stabilising, but not convincingly.",0:"Gold is still sliding and making new lows."}},
 dxy:{t:"The US dollar against other major currencies. Gold is priced in dollars, so a stronger dollar usually pushes gold down and a weaker one helps it.",n:{1:"The dollar has been weakening, which helps gold.",0.5:"The dollar is moving sideways.",0:"The dollar is getting stronger, which weighs on gold."}},
 ry:{t:"The interest US government bonds pay after taking out inflation. Gold pays no interest, so when safe bonds pay more, gold looks less attractive. This is one of gold's most important drivers.",n:{1:"Real yields are falling, which is good for gold.",0.5:"Real yields are roughly flat.",0:"Real yields are rising, which is bad for gold."}},
 cftc:{t:"How many gold bets big speculative funds hold, reported weekly by the US regulator. After heavy selling by funds, the pressure often fades. When their selling slows, one source of downward pressure is easing.",n:{1:"Funds have stopped cutting, or are cutting much less.",0.5:"Funds are still selling, though a bit more slowly.",0:"Funds are still dumping gold at the same pace."}},
 oi:{t:"The number of open gold futures contracts, which shows how much money is in the market. A big drop together with a falling price means traders are being forced out. Steady numbers mean the panic is fading. We use the weekly figure from the US regulator.",n:{1:"Price and open positions are steady, so the panic looks to be fading.",0.5:"Not clear either way.",0:"Positions are being closed fast while price falls: forced selling."}},
 gl_etf:{t:"Gold held by the big gold funds (ETFs). When investors put money in, the funds buy real gold, which supports the price. We track the share count of the largest fund (GLD) and need about 10 days of history before it can score.",n:{1:"Money is flowing into gold funds.",0.5:"Fund holdings are flat.",0:"Money is leaving gold funds."},none:"We are still collecting daily history for this one. It will start scoring in about 10 trading days."},
 in_etf:{t:"Gold held by Indian gold ETFs. We could not find a free daily data source, so this card is for information only and is not counted.",n:{},none:"No free data source found. Not counted."},
 fx:{t:"The rupee against the dollar. If the rupee weakens, gold costs more in rupees even when the dollar price stays flat.",n:{1:"The rupee is steady or stronger, so no extra cost pressure.",0.5:"The rupee is slipping a little.",0:"The rupee is weakening sharply, which raises your rupee price."}},
 gvz:{t:"How jumpy gold prices are expected to be, like a fear gauge for gold. Calm often comes before stable prices. Our own past test found this check unreliable, so it is shown for information only.",n:{1:"Jumpiness is calming down.",0.5:"Jumpiness is about normal.",0:"Jumpiness is rising fast."}},
 policy:{t:"News about India's gold import duty. A duty change can move your price by several percent overnight. This is a rough keyword reading of recent headlines, so read the headlines yourself.",n:{1:"Recent headlines lean towards relief or clarity on duty.",0.5:"Headlines are mixed or quiet.",0:"Recent headlines lean towards tighter duty or restrictions."}},
 asia_cum:{t:"Whether gold rose or fell during Asian trading hours, before Europe and America open. Steady Asian buying on dips can mark a floor, but our tests show it does not reliably warn about Indian prices.",n:{1:"Gold has been bought during Asian hours.",0.5:"Asian-hours moves are mixed.",0:"Gold has been sold during Asian hours."}},
 sh_prem:{t:"How much more (or less) gold costs in Shanghai than abroad. A premium means Chinese buyers are eager and willing to pay extra. It is measured roughly because the markets close at different times.",n:{1:"The Shanghai premium is rising or positive: Chinese demand is returning.",0.5:"Chinese demand looks unchanged.",0:"The Shanghai premium is shrinking or negative: Chinese demand is weak."}},
 ibja_prem:{t:"How much more Indian wholesale gold (the official IBJA rate) costs than the world price converted to rupees with import duty. A rising premium means Indian dealers are charging more than usual, which can mean tight local supply or strong demand. A falling one means gold is getting cheaper locally compared with the world price. It needs about a week of official readings before it can score.",n:{1:"India's price is cheaper than usual compared with the world price.",0.5:"India's premium is about normal.",0:"India's price is expensive compared with the world price."},none:"Building history from the official IBJA rate. It will score after about 5 working days."},
 cnh:{t:"The Chinese yuan against the dollar. A stable or stronger yuan makes gold cheaper for Chinese buyers and supports their demand.",n:{1:"The yuan is stable or stronger.",0.5:"The yuan is drifting slightly.",0:"The yuan is weakening, which hurts Chinese buying."}}};
const nowline=s=>{const m=SIG[s.key]; if(!m) return ""; const say=s.score==null?(m.none||"No data yet."):(m.n[s.score]||""); return `<div class="nowline">Right now: ${say}</div>${info(m.t)}`;};
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
 const v=d.verdict, cls=v.startsWith("BUY")?"buy":v.startsWith("IMP")?"imp":v.startsWith("REB")?"reb":"wait";
 $("sub").textContent=`Wedding purchase tracker · data as of ${d.as_of} · refreshed ${d.updated_utc} UTC`;
 let note="";
 if(d.days_to_wedding!=null){note=d.days_to_wedding<0?"Wedding date has passed":`${d.days_to_wedding} days to wedding`;}
 const sh=d.short||v, cls2=sh=="BUY"?"buy":sh=="WATCH"?"reb":"wait";
 const foryou={BUY:"Good time to buy in stages.",WATCH:"Getting better for buying, but not confirmed yet.",WAIT:"Not a good time to buy yet."}[sh]||"";
 const pct0=x=>x==null?"n/a":Math.round(x*100)+"%", o=d.odds, cf=d.confidence||{};
 const cnt=`Counting ${d.scored} of ${d.n_all} checks today${(d.n_excluded||d.n_nodata)?` (${d.n_excluded||0} shown for information only, ${d.n_nodata||0} still waiting for data)`:""}.`;
 let h=`<div class="hero ${cls2}"><div class="v" style="font-size:34px;letter-spacing:1px">${sh}</div><div class="s" style="font-size:16px;color:#f1f5f9;font-weight:600">For you: ${foryou}</div><div class="s" style="font-size:14px;color:#f1f5f9">${d.msg||""}</div><div class="s">${d.trend||""}</div>`+
 `<div class="s" style="opacity:.85">${d.improving} of ${d.scored} checks favour buying (${Math.round(d.overall*100)}%). ${d.confirmed} of ${d.groups.length} groups agree; BUY needs ${d.needed}. ${cnt}</div>`+
 (o?`<div class="s" style="opacity:.85">Odds from history (not a prediction): in ${o.episodes} similar past episodes, gold was higher 3 months later ${pct0(o.p3)} of the time and 12 months later ${pct0(o.p12)}.</div>`:"")+
 `<div class="s" style="opacity:.85">Confidence in our checks: <b>${cf.level||"LOW"}</b>${cf.tested?` (${cf.helps} of ${cf.tested} tested checks have proven useful so far)`:""}.</div>`+
 `${note?`<div class="n">${note}</div>`:""}${info(IX.hero)}</div>`;
let pl=d.plan;
 if(pl){const rs=x=>"₹"+nf(x,0);
  h+=`<h2>YOUR BUYING PLAN (${pl.target} g of 22K jewellery, finish by ${pl.finish})</h2>${info(IX.plan)}<div class="g"><div class="p" style="font-size:20px">${pl.hold?"Hold: wait until after the "+pl.hold.name:"This month: buy "+pl.suggest+" g"}</div>`+
  `<div class="why" style="color:#cbd5e1;line-height:1.6">${pl.hold?`Event on ${pl.hold.date}.`:(pl.suggest_cost!=null?`About <b>${rs(pl.suggest_cost)}</b> at today's estimated 22K price including GST.`:"")}<br>Remaining: <b>${pl.remaining} g</b> over ${pl.months_left} month(s); an even pace is ${pl.base_per_month.toFixed(1)} g a month. The signals only nudge this (WAIT x0.5, WATCH x1, BUY x1.5), and the last month buys whatever is left.${pl.remaining_cost!=null?`<br>Remaining purchase at today's price: <b>${rs(pl.remaining_cost)}</b>. A normal 1-month price swing moves that by about ±${rs(pl.swing_1m)}, and over 3 months about ±${rs(pl.swing_3m)}.`:""}</div>`+
  (pl.upcoming.length?`<div class="note" style="margin-top:6px">Coming up: ${pl.upcoming.map(e=>`${e.name} in ${e.days} days (${e.date})`).join(" · ")}</div>`:"")+
  `<div class="note">Nudges are mild because the signals have not shown a proven edge. Update grams already bought in config.json. Making charges are not included.</div></div>`;}
 let c=d.context||{};
 if(c.gold!=null){const pc=x=>(x>=0?"+":"")+(x*100).toFixed(1)+"%";
  const pos=c.range_pos==null?"":c.range_pos<.33?"lower third":c.range_pos>.66?"upper third":"middle";
  h+=`<h2>PRICE CONTEXT</h2>${info(IX.context)}<div class="g"><div class="why" style="color:#cbd5e1;line-height:1.7">Gold <b>$${nf(c.gold,0)}</b>: ${pc(c.from_high)} from its 1-year high, in the <b>${pos}</b> of its 1-year range.<br>Versus 50-day average <b>${pc(c.vs50)}</b>${c.vs200!=null?`, versus 200-day average <b>${pc(c.vs200)}</b>`:""}.${c.inr!=null?`<br>22K gold in rupees (estimate, before GST): <b>₹${nf(c.inr,0)}</b> per gram, ${pc(c.inr_chg10)} in 2 weeks, ${c.inr_pos==null?"":Math.round(c.inr_pos*100)+"% of the way up its 3-month range"}.`:""}</div></div>`;}
 if(d.drivers&&d.drivers.length) h+=`<h2>WHAT IS DRIVING GOLD (context, not scored)</h2>${info(IX.drivers)}<div class="g"><div class="why" style="color:#cbd5e1;line-height:1.7">`+d.drivers.map(x=>{const v=x.unit=="%"?nf(x.latest,2)+"%":x.unit=="$"?"$"+nf(x.latest,2):nf(x.latest,x.name.includes("VIX")?1:0);const ch=x.absolute?(x.change>=0?"+":"")+x.change.toFixed(2)+" pp":(x.change>=0?"+":"")+(x.change*100).toFixed(1)+"%";return `${x.name}: <b>${v}</b> (${ch} in 2 weeks)`}).join("<br>")+`</div><div class="note" style="margin-top:6px">A rising 2-year yield means rate-hike pressure, usually bad for gold. A rising VIX with falling stocks can mean forced selling. These are tested as candidates in the table below before they count.</div></div>`;
  h+=`<h2>CONFIRMATION GROUPS</h2>${info(IX.groups)}<div class="groups">`+d.groups.map(g=>{const p=g.score==null?0:Math.round(g.score*100);
  const st=g.score==null?["NO DATA","var(--mute)"]:g.score>=.6?["CONFIRMED","var(--g)"]:g.score>=.4?["PARTIAL","var(--a)"]:["NOT YET","var(--r)"];
  const mem=d.signals.filter(s=>s.group==g.name).map(s=>`${s.name.replace(" (added)","")}${s.excluded?" (info only)":s.score==null?" (no data)":""}`).join(", ");
  return `<div class="g"><div class="t">${g.name}</div><div class="p">${g.score==null?"–":p+"%"}</div><div class="bar"><i style="width:${p}%"></i></div><div class="st" style="color:${st[1]}">${st[0]}</div><div class="note" style="margin-top:6px">Made of: ${mem}</div></div>`}).join("")+`</div>`;
 h+=`<h2>SIGNALS</h2>${info(IX.signals)}`+d.signals.map(s=>{
  const val=s.latest==null?"":(FM[s.fmt]||FM.num2)(s.latest), chg=s.change==null?"":(CH[s.chg_fmt]||CH.none)(s.change);
  let extra=(s.note?`<div class="note">${s.note}</div>`:"")+(s.excluded?`<div class="note" style="color:#fbbf24">Shown for information only: not counted in the verdict</div>`:"");
  if(s.headlines&&s.headlines.length) extra+=`<ul class="news">`+s.headlines.slice(0,3).map(t=>`<li>${t.replace(/</g,"&lt;")}</li>`).join("")+`</ul>`;
  return `<div class="sig"><div class="nm">${s.name}</div><div class="pill">${badge(s.score)}</div><div class="why">${s.why}</div>
  <div class="row2" style="grid-column:1/3;margin-top:6px"><span class="val">${val}</span><span class="chg">${chg}</span>${spark(s.spark)}</div>${nowline(s)}${extra}</div>`}).join("");
if(d.backtest){const b=d.backtest, p=x=>x==null?"n/a":(x>=0?"+":"")+(x*100).toFixed(1)+"%", hp=x=>x==null?"n/a":Math.round(x*100)+"%";
  const order={"helps":0,"no clear edge":1,"backwards":2,"too few observations":3}, tag={"helps":"up","no clear edge":"mid","backwards":"dn","too few observations":"na"};
  h+=`<h2>DO THESE SIGNALS ACTUALLY HELP? (measured on past data)</h2>${info(IX.backtest)}<div class="g"><div class="why" style="color:#cbd5e1;margin-bottom:8px">Across the last ${b.days} days, gold moved <b>${p(b.base_avg)}</b> on average over the next ${b.horizon} trading days (rose ${hp(b.base_hit)} of the time). When the dashboard said:<br>${b.buckets.map(x=>`<b>${x.name}</b>: ${p(x.avg)} (n=${x.n})`).join(" · ")}</div>`+
  b.rows.slice().sort((a,c)=>order[a.verdict]-order[c.verdict]||(c.edge||0)-(a.edge||0)).map(r=>`<div class="row2" style="padding:6px 0;border-top:1px solid #334155"><div style="flex:1"><div style="font-size:13px">${r.name}</div><div class="note" style="color:#94a3b8">after green ${p(r.green_avg)} (rose ${hp(r.green_hit)}, n=${r.n_green}) · after red ${p(r.red_avg)} (rose ${hp(r.red_hit)}, n=${r.n_red})</div></div><span class="badge ${tag[r.verdict]}">${r.verdict.toUpperCase()}</span></div>`).join("")+
  `<div class="note" style="margin-top:8px">Based on about one year of data with overlapping windows, so treat these as hints, not proof. Candidates are tested only and are not part of the score. A signal that is ‘backwards’ or has ‘no clear edge’ is a candidate to drop.${b.base_hit<0.45?` <b style="color:#fbbf24">Warning: gold rose only ${hp(b.base_hit)} of the time in this window, so this mostly shows how signals behaved in a steady downtrend, not whether they can spot a bottom.</b>`:""}</div></div>`;}
 if(d.base_rates){const b=d.base_rates,p=x=>x==null?"n/a":(x>=0?"+":"")+(x*100).toFixed(0)+"%",hp=x=>x==null?"n/a":Math.round(x*100)+"%";
  h+=`<h2>25-YEAR BASE RATES (what gold did after similar situations)</h2>${info(IX.base)}<div class="g"><div class="why" style="color:#cbd5e1;margin-bottom:6px">Now: ${(b.now.from_high*100).toFixed(0)}% from the 1-year high, ${(b.now.vs200*100).toFixed(0)}% versus the 200-day average, RSI ${b.now.rsi.toFixed(0)}. History since ${b.since}.</div>`+
  b.rows.map(r=>`<div style="padding:6px 0;border-top:1px solid #334155"><div style="font-size:13px"><b>${r.name}</b> <span class="note">(${r.days} days, ${r.episodes} separate episodes)</span></div><div class="note" style="color:#94a3b8">3 months later: median ${p(r["3 months"].median)}, rose ${hp(r["3 months"].pos)} · 12 months later: median ${p(r["12 months"].median)}, rose ${hp(r["12 months"].pos)} · worst 10% of 12-month outcomes ${p(r["12 months"].p10)} · typical further drop within 3 months ${p(r.further_drop_median)}</div></div>`).join("")+
  `<div class="note" style="margin-top:6px">Few separate episodes, so treat these as rough odds, not promises. Past patterns can break.</div></div>`;}
  if(d.lead_lag) h+=`<h2>DOES ASIA LEAD INDIA? (measured, not assumed)</h2>${info(IX.lead)}<div class="g">`+d.lead_lag.map(x=>`<div class="why" style="color:#cbd5e1;margin-bottom:6px">${x.label} vs Indian gold ETF (GOLDBEES): same-day correlation <b>${x.same}</b>${x.nxt==null?"":`, next-day <b>${x.nxt}</b>`} (${x.n} days)</div>`).join("")+`<div class="note">Next-day near 0 (between -0.2 and 0.2) means no early-warning value for India. Same-day only shows overlap of trading hours.</div></div>`;
 if(d.asia_gold_news&&d.asia_gold_news.length) h+=`<h2>WEEKLY ASIA PHYSICAL DEMAND (Reuters, context only, not scored)</h2>${info(IX.news)}<div class="g"><ul class="news" style="margin:0">`+d.asia_gold_news.map(t=>`<li>${t.replace(/</g,"&lt;")}</li>`).join("")+`</ul><div class="note" style="margin-top:6px">Shows India dealer discount/premium and China/Singapore/Hong Kong premiums each Friday.</div></div>`;
 if(d.rates){const r=d.rates, rs=x=>"₹"+nf(x,0), ib=r.ibja;
  h+=`<h2>22K GOLD PRICE</h2>${info(IX.india)}<div class="g">`+
  (ib?`<div class="t">Official IBJA benchmark, 22K (916), per gram, before GST</div><div class="p" style="color:var(--gold)">${rs(ib.p916_g)}</div><div class="note" style="color:#cbd5e1">${ib.date} ${ib.session} fixing (the latest official print we could read)</div>`:`<div class="note" style="color:#fbbf24">Could not read the official IBJA rate this time, so only the estimate below is shown.</div>`)+
  `<div class="t" style="margin-top:10px">Live estimate now${r.calibrated?" (matched to the IBJA rate)":" (not matched to IBJA)"}, 22K per gram, before GST</div><div class="p">${rs(r.p22_ex)}</div>`+
  `<div class="why" style="color:#cbd5e1;margin-top:8px;line-height:1.7">With ${(r.gst*100).toFixed(0)}% GST: <b>${rs(r.p22_gst)}</b> per gram${r.making>0?`<br>With GST and ${(r.making*100).toFixed(0)}% making charges: <b>${rs(r.p22_all)}</b> per gram`:""}<br>Built from ${r.source} $${nf(r.gold_usd,0)}, rupee ${nf(r.usdinr,2)}, import duty ${(r.duty*100).toFixed(0)}%${r.local_premium?`, Indian premium ${(r.local_premium*100).toFixed(1)}%`:""}.</div>`+
  `<div class="note" style="margin-top:6px">IBJA is India's official benchmark. It is declared around 12:05 pm and 5:05 pm IST on working days, and not on weekends or holidays. Between fixings the estimate moves with the world price and the rupee. Shop rates add making charges and can differ by a percent or so, so check your jeweller's board on the day. Official page: <a href="https://ibjarates.com" style="color:#38bdf8">ibjarates.com</a>.${r.making>0?"":" Set making_charge_pct in config.json once your jeweller quotes it."}</div></div>`;}
 $("app").innerHTML=h;
 $("foot").innerHTML="A price rebound alone is not enough: the verdict needs several independent groups to improve together. Framework only, not financial advice.<br>Data: Yahoo Finance, FRED/US Treasury, CFTC, Shanghai Gold Exchange, IBJA, Google News. "+(d.log||[]).filter(x=>x.startsWith("FAIL")).map(x=>"<br>⚠ "+x).join("")+`<details style="margin-top:10px"><summary>Data health (tap to open)</summary>${(d.health||[]).map(x=>"<br>"+x).join("")}<br><br>${(d.log||[]).map(x=>x.replace(/</g,"&lt;")).join("<br>")}</details>`;
}).catch(e=>{$("sub").textContent="Waiting for the first data refresh (Actions tab → Update gold data → Run workflow).";});
</script></body></html>
