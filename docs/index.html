<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gold Market Monitor</title>
<style>
:root{--bg:#070b14;--surface:#111827;--surface2:#182235;--line:#26344b;--txt:#edf2fb;--mute:#9aa9bf;--gold:#f4c44e;--g:#57d68a;--a:#f5bf4f;--r:#ff737b;--blue:#7db8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15213a 0,#080d17 48%);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 32px}
.wrap{max-width:820px;margin:0 auto}h1{font-size:20px;margin:5px 0 2px;color:var(--gold);letter-spacing:1.3px;font-weight:800}.sub{color:var(--mute);font-size:11px;margin-bottom:12px;line-height:1.5}
.hero{border-radius:18px;padding:17px;margin:0 0 14px;border:1px solid #3b4b63;background:linear-gradient(145deg,#18253b,#101827);box-shadow:0 8px 24px #0002}.hero.buy{background:linear-gradient(145deg,#153b2b,#10251d);border-color:#246443}.hero.imp{background:linear-gradient(145deg,#19372f,#111f1d)}.hero.reb{background:linear-gradient(145deg,#3b2a16,#21190e)}.hero.wait{background:linear-gradient(145deg,#3b1b24,#21121a)}.hero .v{font-size:30px!important;font-weight:850;letter-spacing:.4px}.hero .s{color:#d1d9e6;font-size:12.5px;margin-top:8px}.hero .n{color:var(--gold);font-size:13px;margin-top:6px}
h2{font-size:10px;letter-spacing:1.3px;color:#a9b9d0;margin:18px 0 9px;font-weight:750}
.g,.healthrow{background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:13px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.g .t{font-size:11px;color:var(--mute)}.g .p{font-size:21px;font-weight:800;margin:2px 0}.bar{height:5px;border-radius:4px;background:#29374d;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d5a638,var(--gold));border-radius:4px}.g .st{font-size:10px;font-weight:750;margin-top:6px}
.sig{background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}.sig .nm{font-weight:700;font-size:13px}.sig .why{grid-column:1/2;color:var(--mute);font-size:11.5px}.sig .val{text-align:right;font-weight:700}.sig .chg{text-align:right;color:var(--mute);font-size:11px}.pill{grid-row:1/3;grid-column:2;justify-self:end}.badge{font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px;white-space:nowrap}.up{background:#123b2a;color:var(--g)}.mid{background:#3b2d16;color:var(--a)}.dn{background:#3d1b24;color:var(--r)}.na{background:#273349;color:var(--mute)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}.sp{width:70px;height:22px}.note{grid-column:1/3;color:#8293ab;font-size:10.5px}.news{font-size:11.5px;color:var(--mute);margin:4px 0 0;padding-left:16px}.foot{color:#8091a9;font-size:10.5px;margin-top:18px;line-height:1.6}.info{margin:7px 0 0}.info summary{cursor:pointer;color:var(--blue);font-size:11px;list-style:none}.info summary::-webkit-details-marker{display:none}.info div{background:#0a101c;border:1px solid #25334a;border-radius:9px;padding:9px 10px;margin-top:6px;font-size:12px;line-height:1.55;color:#cbd6e6;font-weight:400}.nowline{font-size:11.5px;color:#e2e8f0;margin-top:7px;grid-column:1/3}.healthgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.healthrow{font-size:11px;padding:10px}.healthrow .meta{color:var(--mute);margin-top:4px}.status{font-weight:800}.fresh{color:var(--g)}.delayed{color:var(--a)}.stale,.missing{color:var(--r)}.alert{background:#38241a;border:1px solid #815123;border-radius:10px;padding:10px;font-size:11.5px;margin:8px 0}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px;margin:0 0 8px;position:sticky;top:0;z-index:10;background:#080d17ef;backdrop-filter:blur(12px);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid #29374d;background:#111a29;color:#aab8cc;padding:9px 13px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer}.tab.active{background:#3c321b;color:#f7d36b;border-color:#8b6d2e}.panel{display:none;animation:fade .16s ease}.panel.active{display:block}.panel>h2:first-child{margin-top:8px}.panel .g{margin-bottom:9px}.foot details{border:1px solid var(--line);background:var(--surface);padding:10px;border-radius:12px}.foot summary{cursor:pointer;color:var(--blue)}
@keyframes fade{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:480px){body{padding-left:11px;padding-right:11px}.healthgrid{grid-template-columns:1fr}.groups{grid-template-columns:1fr 1fr;gap:7px}.g{padding:11px}.sig{padding:11px}.hero{padding:15px}.tab{padding:9px 11px}}

/* Redesigned mobile navigation and panel layout */
.navtabs{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:20;padding:8px 0 10px;background:var(--bg);scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtab{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:9px 13px;font:600 12px inherit;white-space:nowrap;cursor:pointer}
.navtab.active{background:#f5c542;color:#111827;border-color:#f5c542}
.panel{display:none}.panel.active{display:block}
.panel-title{font-size:12px;letter-spacing:1.1px;color:var(--gold);margin:17px 0 8px;font-weight:700}
.panel .hero{margin-top:10px}
.panel .groups{gap:8px}
.panel .g,.panel .sig,.panel .healthrow{box-shadow:0 1px 0 rgba(255,255,255,.025)}
.panel h2:first-child{margin-top:10px}
@media(min-width:520px){.healthgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}

 const p=a.map((v,i)=>(i/(a.length-1)*70).toFixed(1)+","+(20-((v-mn)/r)*18).toFixed(1)).join(" ");

 hero:"This status summarises the current indicator checklist. SUPPORTIVE means several scored indicators align with stabilisation; MIXED means evidence is uneven; UNCONFIRMED means the checks do not yet align. The score is not a probability or forecast, and the system has not established predictive reliability.",
 plan:"Personalized purchase schedules are not shown in this dashboard. The monitor focuses on observable data, signal transparency, and historical testing.",

const SIG={
 gold:{t:"The price of gold in US dollars, the world benchmark. Indian prices follow it closely. Buyers usually do better waiting until a fall has stopped instead of buying while it is still sliding.",n:{1:"Gold has stopped making new lows and is holding above its recent average.",0.5:"Gold is partly stabilising, but not convincingly.",0:"Gold is still sliding and making new lows."}},

 asia_cum:{t:"Whether gold rose or fell during Asian trading hours, before Europe and America open. Steady Asian buying on dips can mark a floor, but our tests show it does not reliably warn about Indian prices.",n:{1:"Gold has been bought during Asian hours.",0.5:"Asian-hours moves are mixed.",0:"Gold has been sold during Asian hours."}},
 sh_prem:{t:"How much more (or less) gold costs in Shanghai than abroad. A premium means Chinese buyers are eager and willing to pay extra. It is measured roughly because the markets close at different times.",n:{1:"The Shanghai premium is rising or positive: Chinese demand is returning.",0.5:"Chinese demand looks unchanged.",0:"The Shanghai premium is shrinking or negative: Chinese demand is weak."}},

 cnh:{t:"The Chinese yuan against the dollar. A stable or stronger yuan makes gold cheaper for Chinese buyers and supports their demand.",n:{1:"The yuan is stable or stronger.",0.5:"The yuan is drifting slightly.",0:"The yuan is weakening, which hurts Chinese buying."}}};

 `${note?`<div class="n">${no
