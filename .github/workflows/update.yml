name: Update gold data
on:
  schedule:
    - cron: "30 2 * * 1-6"    # 08:00 IST: previous IBJA PM rate and US close
    - cron: "0 8 * * 1-6"     # 13:30 IST: Asia session done, IBJA morning rate out
    - cron: "15 12 * * 1-5"   # 17:45 IST: IBJA evening rate out
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add docs/data.json docs/etf_state.csv docs/ibja_history.csv
          git diff --staged --quiet || git commit -m "Daily refresh"
          git pull --rebase
          git push
